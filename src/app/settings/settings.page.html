<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Settings</ion-title>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Settings</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card align="center">
    <ion-item>
      <ion-input label="Username" [(ngModel)]="username" placeholder="Enter your username"></ion-input>
    </ion-item>
    <ion-button (click)="saveUsername()">Save</ion-button>
  </ion-card>
  <ion-card>

  </ion-card>


   <ion-item>
      <ion-toggle [(ngModel)]="paletteToggle" (ionChange)="toggleChange($event)" justify="space-between"
        >Dark Mode</ion-toggle
      >
    </ion-item>












</ion-content>
